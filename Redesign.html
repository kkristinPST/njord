<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NJORD: Screen Redesigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bundle/app.css">
<script>
  /* apply persisted theme before first paint to avoid a flash */
  (function () { try { document.documentElement.setAttribute("data-theme", localStorage.getItem("nj_theme_v1") || "light"); } catch (e) { document.documentElement.setAttribute("data-theme", "light"); } })();
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-sans); color: var(--fg); background: var(--bg); }
  a { color: var(--primary-text); text-decoration: none; }
  a:hover { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0F182B"/>
    <g transform="translate(37 28) scale(1)" fill="#00AEEE">
      <path d="M13.2 27.6 22.3 16.9c.8-1 .8-2.5 0-3.5L11.8.9C11.3.3 10.5 0 9.7 0 8.9 0 8.2.3 7.7.9L-2.9 13.4c-.8 1-.8 2.5 0 3.5L6.2 27.6-2.9 38.3c-1 1.1-.8 2.8.3 3.7 1.1 1 2.8.9 3.8-.3l8.5-10 8.5 10c.5.6 1.3 1 2 1 .6 0 1.2-.2 1.8-.6 1.1-1 1.2-2.7.3-3.8L13.2 27.6ZM9.7 6.8l7 8.3-7 8.3-7-8.3 7-8.3Z"/>
    </g>
  </svg>
</template>

<!-- React + lucide are vendored locally: same origin as the page, so no extra DNS/TLS
     handshake and no unpkg @latest redirect on every load. -->
<script src="vendor/react.production.min.js" defer></script>
<script src="vendor/react-dom.production.min.js" defer></script>
<script src="vendor/lucide.min.js" defer></script>

<!-- The app, precompiled by build.mjs. This used to be 54 <script type="text/babel"> tags
     transpiled in the browser by @babel/standalone; edit the .jsx sources and run
     `npm run build` (or `npm run watch`) to regenerate. -->
<script src="bundle/app.js" defer></script>
</body>
</html>
